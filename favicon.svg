<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="iCareU">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ED8F8"/><stop offset=".55" stop-color="#A9E6DA"/><stop offset="1" stop-color="#C3F0A4"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4A9BF5"/><stop offset="1" stop-color="#1B5FC8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#7FDA8C"/><stop offset="1" stop-color="#39A85C"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".22" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#glow)"/>

  <!-- i -->
  <rect x="120" y="232" width="54" height="182" rx="27" fill="url(#blue)"/>

  <!-- U -->
  <path d="M250 232v88a80 80 0 0 0 160 0v-88" fill="none" stroke="url(#blue)"
        stroke-width="56" stroke-linecap="round"/>

  <!-- heart in the bowl of the U -->
  <path d="M330 372c-40-26-58-47-58-69a34 34 0 0 1 58-24 34 34 0 0 1 58 24c0 22-18 43-58 69z"
        fill="url(#green)"/>
  <path d="M330 356c-30-20-44-36-44-53a22 22 0 0 1 44-16 22 22 0 0 1 44 16c0 17-14 33-44 53z"
        fill="#EAFBEF"/>

  <!-- capsule over the i -->
  <g transform="rotate(-38 147 172)">
    <rect x="107" y="149" width="80" height="46" rx="23" fill="#ffffff"/>
    <path d="M130 149h34a23 23 0 0 1 0 46h-34z" fill="#2E86F0"/>
    <rect x="107" y="149" width="80" height="46" rx="23" fill="none" stroke="#1B5FC8" stroke-width="4" opacity=".25"/>
  </g>

  <!-- capsule beside the U -->
  <g transform="rotate(34 356 168)">
    <rect x="316" y="145" width="80" height="46" rx="23" fill="#5FC97A"/>
    <path d="M339 145h34a23 23 0 0 1 0 46h-34z" fill="#F0625E"/>
  </g>
</svg>
